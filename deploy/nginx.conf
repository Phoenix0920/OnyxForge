# OnyxForge · nginx 站点配置(单域静态托管)
# 用法:
#   - Docker(推荐):见 deploy/Dockerfile + scripts/docker-build.sh
#   - 裸机:把本文件放到 /etc/nginx/conf.d/onyxforge.conf,并把 root 指向发布目录
#     (发布目录 = scripts/assemble-site.mjs 产出的 tools/dist/site)
#
# 说明:壳用 HashRouter,本身无需回退;it-tools 用 history 路由(createWebHistory('/tools/it')),
#       因此 /tools/it/* 无扩展名路径须回退到 /tools/it/index.html。
# HTTPS 建议交由 certbot/权威证书处理(或 Caddy),本配置保持 http。

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 壳入口不缓存
    location = /index.html { add_header Cache-Control "no-cache"; }

    # it-tools(history 路由 -> 子站入口回退)
    location ^~ /tools/it/ {
        try_files $uri $uri/ /tools/it/index.html;
    }

    # SRK / CyberChef(深链用 hash,只需保证目录可访问)
    location ^~ /tools/srk/ {
        try_files $uri $uri/ /tools/srk/index.html;
    }

    # 其余(壳 SPA + tools.json)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
